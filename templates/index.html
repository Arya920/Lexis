<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-0: #0a0a0b;
            --bg-1: #111113;
            --bg-2: #18181b;
            --bg-3: #1f1f23;
            --bg-4: #28282e;
            --border: #2e2e34;
            --border-light: #3a3a42;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --accent: #6366f1;
            --accent-dim: rgba(99,102,241,0.12);
            --accent-border: rgba(99,102,241,0.3);
            --user-bg: #1e1e4a;
            --user-border: #3030a0;
            --success: #22c55e;
            --danger: #ef4444;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
            --sidebar-w: 260px;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-0);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* LIGHT MODE */
        body.light {
            --bg-0: #f8f8f9;
            --bg-1: #ffffff;
            --bg-2: #f1f1f3;
            --bg-3: #e8e8ec;
            --bg-4: #dcdce2;
            --border: #dcdce2;
            --border-light: #c4c4cc;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            --user-bg: #ededff;
            --user-border: #a5b4fc;
        }

        /* ── LAYOUT ── */
        .shell {
            display: flex;
            height: 100vh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-w);
            background: var(--bg-1);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.22s cubic-bezier(0.4,0,0.2,1), width 0.22s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 0;
        }

        .sidebar-inner {
            width: var(--sidebar-w);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .sidebar-header {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0;
        }

        .sidebar-brand {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        .sidebar-brand span {
            font-family: var(--font-mono);
            color: var(--text-muted);
            font-size: 10px;
            display: block;
            margin-top: 1px;
        }

        .sidebar-section {
            padding: 14px 16px 8px;
        }

        .sidebar-section-label {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .sidebar-action-btn {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 7px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.15s;
            text-align: left;
        }

        .sidebar-action-btn:hover {
            background: var(--bg-3);
            color: var(--text-primary);
            border-color: var(--border);
        }

        .sidebar-action-btn.danger:hover {
            background: rgba(239,68,68,0.08);
            color: var(--danger);
            border-color: rgba(239,68,68,0.2);
        }

        .sidebar-action-btn i { width: 14px; text-align: center; font-size: 12px; }

        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 16px;
        }

        .doc-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 16px 16px;
        }

        .doc-list::-webkit-scrollbar { width: 3px; }
        .doc-list::-webkit-scrollbar-track { background: transparent; }
        .doc-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .doc-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 7px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
            margin-bottom: 2px;
        }

        .doc-item:hover {
            background: var(--bg-3);
            border-color: var(--border);
        }

        .doc-icon {
            width: 28px;
            height: 28px;
            border-radius: 5px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .doc-info { flex: 1; min-width: 0; }

        .doc-name {
            font-size: 12px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-meta {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .doc-status {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 10px;
            border-radius: 7px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 12px;
            font-family: var(--font-body);
            cursor: pointer;
            width: 100%;
            transition: all 0.15s;
        }

        .mode-toggle:hover { background: var(--bg-3); color: var(--text-primary); }

        .toggle-pill {
            margin-left: auto;
            width: 30px;
            height: 16px;
            background: var(--bg-4);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            position: relative;
            transition: background 0.2s;
        }

        .toggle-pill::after {
            content: '';
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
            top: 2px;
            left: 2px;
            transition: all 0.2s;
        }

        body.light .toggle-pill { background: var(--accent); border-color: var(--accent); }
        body.light .toggle-pill::after { background: #fff; left: 16px; }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg-0);
        }

        /* ── TOPBAR ── */
        .topbar {
            height: 52px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-1);
            gap: 10px;
            flex-shrink: 0;
        }

        .topbar-toggle {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
        }

        .topbar-toggle:hover { background: var(--bg-3); color: var(--text-primary); }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .topbar-title-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .topbar-badge {
            font-family: var(--font-mono);
            font-size: 9px;
            letter-spacing: 0.08em;
            padding: 2px 7px;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
            border: 1px solid var(--accent-border);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .topbar-btn {
            height: 30px;
            padding: 0 11px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-family: var(--font-body);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .topbar-btn:hover { background: var(--bg-3); color: var(--text-primary); }
        .topbar-btn.danger:hover { background: rgba(239,68,68,0.08); color: var(--danger); border-color: rgba(239,68,68,0.25); }

        /* ── MESSAGES ── */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .messages-area::-webkit-scrollbar { width: 4px; }
        .messages-area::-webkit-scrollbar-track { background: transparent; }
        .messages-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .msg-row {
            display: flex;
            padding: 4px 24px;
            animation: slide-up 0.18s ease-out;
        }

        @keyframes slide-up {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-row.user { justify-content: flex-end; }
        .msg-row.ai { justify-content: flex-start; }

        .msg-bubble {
            max-width: 68%;
            padding: 11px 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.65;
            position: relative;
        }

        .msg-row.user .msg-bubble {
            background: var(--user-bg);
            border: 1px solid var(--user-border);
            color: var(--text-primary);
            border-bottom-right-radius: 3px;
        }

        .msg-row.ai .msg-bubble {
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-bottom-left-radius: 3px;
        }

        .msg-meta {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-row.user .msg-meta { justify-content: flex-end; }

        .msg-sender {
            font-size: 10px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-family: var(--font-mono);
        }

        /* AI avatar */
        .ai-avatar {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #fff;
            flex-shrink: 0;
            margin-right: 10px;
            margin-top: 2px;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
            text-align: center;
            gap: 12px;
        }

        .empty-icon {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .empty-sub {
            font-size: 13px;
            color: var(--text-muted);
            max-width: 340px;
            line-height: 1.6;
        }

        .empty-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            margin-top: 8px;
        }

        .chip {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-2);
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            font-family: var(--font-mono);
        }

        .chip:hover { border-color: var(--accent-border); color: var(--accent); background: var(--accent-dim); }

        /* ── TYPING ── */
        .typing-row {
            display: flex;
            align-items: center;
            padding: 8px 24px;
            gap: 10px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            border-bottom-left-radius: 3px;
        }

        .typing-dots span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: blink 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ── INPUT BAR ── */
        .input-bar {
            padding: 14px 24px 18px;
            border-top: 1px solid var(--border);
            background: var(--bg-1);
            flex-shrink: 0;
        }

        .input-wrap {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: 10px;
            transition: border-color 0.15s;
        }

        .input-wrap:focus-within {
            border-color: var(--border-light);
        }

        .file-label {
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            flex-shrink: 0;
        }

        .file-label:hover { background: var(--bg-4); color: var(--text-secondary); }

        .msg-textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 14px;
            font-family: var(--font-body);
            resize: none;
            line-height: 1.55;
            max-height: 120px;
        }

        .msg-textarea::placeholder { color: var(--text-muted); }

        .send-btn {
            width: 32px;
            height: 32px;
            border-radius: 7px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) { background: #4f52d9; transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

        .input-hint {
            max-width: 820px;
            margin: 6px auto 0;
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--text-muted);
            padding: 0 2px;
        }

        /* ── MODAL (clear confirm) ── */
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fade-in 0.15s;
        }

        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

        .modal {
            background: var(--bg-2);
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 24px;
            width: 320px;
        }

        .modal-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .modal-body {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .modal-btn {
            height: 32px;
            padding: 0 14px;
            border-radius: 7px;
            font-size: 13px;
            font-family: var(--font-body);
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
        }

        .modal-btn:hover { background: var(--bg-3); color: var(--text-primary); }

        .modal-btn.primary {
            background: var(--danger);
            border-color: var(--danger);
            color: #fff;
        }

        .modal-btn.primary:hover { background: #dc2626; }

        /* toast */
        .toast {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-3);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 9px 16px;
            font-size: 13px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
            animation: toast-in 0.2s ease;
            z-index: 50;
            white-space: nowrap;
        }

        @keyframes toast-in {
            from { opacity: 0; transform: translateX(-50%) translateY(8px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
    </style>
</head>
<body>
<div id="root"></div>
{% raw %}
<script type="text/babel">
    const { useState, useRef, useEffect, useCallback } = React;

    const SAMPLE_DOCS = [
        { id: 1, name: 'Company Handbook.pdf', size: '2.4 MB', type: 'pdf' },
        { id: 2, name: 'Product Docs.docx', size: '1.8 MB', type: 'doc' },
        { id: 3, name: 'Tech Specs.pdf', size: '3.2 MB', type: 'pdf' },
    ];

    const SUGGESTIONS = [
        'Summarize the handbook',
        'What are the tech specs?',
        'Key product features',
    ];

    function App() {
        const [messages, setMessages] = useState([]);
        const [input, setInput] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const [docs, setDocs] = useState(SAMPLE_DOCS);
        const [sidebarOpen, setSidebarOpen] = useState(true);
        const [lightMode, setLightMode] = useState(false);
        const [showClearModal, setShowClearModal] = useState(false);
        const [toast, setToast] = useState(null);
        const messagesEndRef = useRef(null);
        const textareaRef = useRef(null);

        useEffect(() => {
            messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        }, [messages, isTyping]);

        const showToast = (msg) => {
            setToast(msg);
            setTimeout(() => setToast(null), 2400);
        };

        const toggleMode = () => {
            setLightMode(p => {
                document.body.classList.toggle('light', !p);
                return !p;
            });
        };

        const handleSend = async () => {
            if (!input.trim() || isTyping) return;
            const text = input.trim();
            setInput('');
            textareaRef.current.style.height = 'auto';

            const userMsg = {
                id: Date.now(),
                sender: 'user',
                text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(p => [...p, userMsg]);
            setIsTyping(true);

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                const aiMsg = {
                    id: Date.now() + 1,
                    sender: 'ai',
                    text: data.response,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                setMessages(p => [...p, aiMsg]);
            } catch (e) {
                console.error(e);
            }
            setIsTyping(false);
        };

        const handleKeyDown = (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        };

        const handleTextareaInput = (e) => {
            setInput(e.target.value);
            e.target.style.height = 'auto';
            e.target.style.height = Math.min(e.target.scrollHeight, 120) + 'px';
        };

        const handleFileUpload = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                setDocs(p => [...p, {
                    id: Date.now(),
                    name: data.filename || file.name,
                    size: (file.size / 1024 / 1024).toFixed(1) + ' MB',
                    type: file.name.endsWith('.pdf') ? 'pdf' : 'doc'
                }]);
                showToast('Document indexed successfully');
            } catch (e) {
                console.error(e);
            }
            e.target.value = '';
        };

        const confirmClear = () => {
            setMessages([]);
            setShowClearModal(false);
            showToast('Conversation cleared');
        };

        const typeIcon = (t) => t === 'pdf' ? 'fa-file-pdf' : 'fa-file-word';

        return (
            <div className="shell" style={{ position: 'relative' }}>
                {/* SIDEBAR */}
                <aside className={`sidebar ${sidebarOpen ? '' : 'collapsed'}`}>
                    <div className="sidebar-inner">
                        <div className="sidebar-header">
                            <div className="sidebar-logo"><i className="fas fa-brain"></i></div>
                            <div className="sidebar-brand">
                                RAG Assistant
                                <span>v2.0 · enterprise</span>
                            </div>
                        </div>

                        <div className="sidebar-section">
                            <div className="sidebar-section-label">Actions</div>
                            <button className="sidebar-action-btn danger" onClick={() => setShowClearModal(true)}>
                                <i className="fas fa-trash-alt"></i>
                                Clear conversation
                            </button>
                            <input type="file" id="sb-upload" style={{ display: 'none' }} onChange={handleFileUpload} />
                            <label htmlFor="sb-upload" className="sidebar-action-btn" style={{ cursor: 'pointer', display: 'flex' }}>
                                <i className="fas fa-cloud-upload-alt"></i>
                                Upload document
                            </label>
                        </div>

                        <div className="sidebar-divider" />

                        <div className="sidebar-section" style={{ flex: 1, display: 'flex', flexDirection: 'column', minHeight: 0 }}>
                            <div className="sidebar-section-label">Knowledge base · {docs.length} files</div>
                            <div className="doc-list">
                                {docs.map(d => (
                                    <div className="doc-item" key={d.id}>
                                        <div className="doc-icon"><i className={`fas ${typeIcon(d.type)}`}></i></div>
                                        <div className="doc-info">
                                            <div className="doc-name">{d.name}</div>
                                            <div className="doc-meta">{d.size}</div>
                                        </div>
                                        <div className="doc-status"></div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="sidebar-footer">
                            <button className="mode-toggle" onClick={toggleMode}>
                                <i className={`fas fa-${lightMode ? 'sun' : 'moon'}`} style={{ fontSize: 12 }}></i>
                                {lightMode ? 'Light mode' : 'Dark mode'}
                                <div className="toggle-pill" />
                            </button>
                        </div>
                    </div>
                </aside>

                {/* MAIN */}
                <main className="main">
                    <div className="topbar">
                        <button className="topbar-toggle" onClick={() => setSidebarOpen(p => !p)} title="Toggle sidebar">
                            <i className="fas fa-bars"></i>
                        </button>
                        <div className="topbar-title">
                            <span className="topbar-title-text">Conversation</span>
                            <span className="topbar-badge">RAG · {docs.length} docs</span>
                        </div>
                        <div className="topbar-actions">
                            <button className="topbar-btn" onClick={toggleMode}>
                                <i className={`fas fa-${lightMode ? 'moon' : 'sun'}`}></i>
                                {lightMode ? 'Dark' : 'Light'}
                            </button>
                            <button className="topbar-btn danger" onClick={() => setShowClearModal(true)}>
                                <i className="fas fa-rotate-left"></i>
                                Clear
                            </button>
                        </div>
                    </div>

                    <div className="messages-area">
                        {messages.length === 0 && !isTyping && (
                            <div className="empty-state">
                                <div className="empty-icon"><i className="fas fa-comments"></i></div>
                                <div className="empty-title">Ask your knowledge base</div>
                                <div className="empty-sub">Upload documents via the sidebar, then ask questions. The assistant retrieves and synthesises relevant information from your files.</div>
                                <div className="empty-chips">
                                    {SUGGESTIONS.map(s => (
                                        <div key={s} className="chip" onClick={() => { setInput(s); textareaRef.current?.focus(); }}>
                                            {s}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {messages.map(m => (
                            <div key={m.id} className={`msg-row ${m.sender}`}>
                                {m.sender === 'ai' && (
                                    <div className="ai-avatar"><i className="fas fa-microchip"></i></div>
                                )}
                                <div>
                                    <div className="msg-sender">
                                        {m.sender === 'ai' ? 'assistant' : 'you'}
                                    </div>
                                    <div className="msg-bubble">{m.text}</div>
                                    <div className="msg-meta">
                                        <span>{m.time}</span>
                                    </div>
                                </div>
                            </div>
                        ))}

                        {isTyping && (
                            <div className="typing-row">
                                <div className="ai-avatar"><i className="fas fa-microchip"></i></div>
                                <div className="typing-dots">
                                    <span /><span /><span />
                                </div>
                            </div>
                        )}
                        <div ref={messagesEndRef} />
                    </div>

                    <div className="input-bar">
                        <div className="input-wrap">
                            <input type="file" id="inline-upload" style={{ display: 'none' }} onChange={handleFileUpload} />
                            <label htmlFor="inline-upload" className="file-label" title="Attach document">
                                <i className="fas fa-paperclip"></i>
                            </label>
                            <textarea
                                ref={textareaRef}
                                className="msg-textarea"
                                value={input}
                                onChange={handleTextareaInput}
                                onKeyDown={handleKeyDown}
                                placeholder="Ask anything about your documents…"
                                rows={1}
                            />
                            <button className="send-btn" onClick={handleSend} disabled={!input.trim() || isTyping} title="Send">
                                <i className="fas fa-arrow-up"></i>
                            </button>
                        </div>
                        <div className="input-hint">↵ send · shift+↵ newline · drag files to sidebar</div>
                    </div>
                </main>

                {/* CLEAR MODAL */}
                {showClearModal && (
                    <div className="modal-backdrop" onClick={() => setShowClearModal(false)}>
                        <div className="modal" onClick={e => e.stopPropagation()}>
                            <div className="modal-title">Clear conversation?</div>
                            <div className="modal-body">This will permanently delete all messages in the current session. Your knowledge base documents will remain indexed.</div>
                            <div className="modal-actions">
                                <button className="modal-btn" onClick={() => setShowClearModal(false)}>Cancel</button>
                                <button className="modal-btn primary" onClick={confirmClear}>Clear chat</button>
                            </div>
                        </div>
                    </div>
                )}

                {/* TOAST */}
                {toast && (
                    <div className="toast">
                        <div className="dot" />
                        {toast}
                    </div>
                )}
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>
