<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexis — Knowledge Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    button { font-family: inherit; }

    :root {
      --font-sans: 'Geist', -apple-system, sans-serif;
      --font-mono: 'Geist Mono', 'IBM Plex Mono', monospace;

      --s0: #08090c;
      --s1: #0d0e12;
      --s2: #13141a;
      --s3: #1a1b22;
      --s4: #22242d;
      --s5: #2b2d38;

      --b1: rgba(255,255,255,0.055);
      --b2: rgba(255,255,255,0.10);
      --b3: rgba(255,255,255,0.16);

      --t1: #f0f0f2;
      --t2: #9a9aaa;
      --t3: #4a4a5a;

      --a:       #7c6ef9;
      --a-dim:   rgba(124,110,249,0.10);
      --a-bdr:   rgba(124,110,249,0.28);
      --a-hover: #6a5ce8;

      --u-bg:  #17183a;
      --u-bdr: rgba(124,110,249,0.35);

      --ok:   #34d399;
      --err:  #f87171;
      --warn: #fbbf24;

      --sb-w: 268px;
      --r-sm: 6px;
      --r-md: 9px;
      --r-lg: 13px;
      --tr:   0.18s cubic-bezier(0.4,0,0.2,1);
    }

    body.light {
      --s0: #f4f4f7;
      --s1: #ffffff;
      --s2: #f0f0f4;
      --s3: #e8e8ee;
      --s4: #dddde6;
      --s5: #d0d0dc;
      --b1: rgba(0,0,0,0.07);
      --b2: rgba(0,0,0,0.11);
      --b3: rgba(0,0,0,0.18);
      --t1: #111116;
      --t2: #55555f;
      --t3: #a0a0b0;
      --u-bg:  #eeeeff;
      --u-bdr: rgba(124,110,249,0.30);
    }

    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--s0);
      color: var(--t1);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--b2); border-radius: 2px; }

    /* ── SHELL ── */
    .shell { display:flex; height:100vh; position:relative; overflow:hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sb-w);
      min-width: var(--sb-w);
      background: var(--s1);
      border-right: 1px solid var(--b1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
      transition: min-width var(--tr), width var(--tr), border-color var(--tr);
    }
    .sidebar.closed { width:0; min-width:0; border-right-color:transparent; }

    .sb-inner { width:var(--sb-w); min-width:var(--sb-w); height:100%; display:flex; flex-direction:column; }

    /* brand */
    .sb-brand {
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--b1);
      display: flex;
      align-items: center;
      gap: 11px;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 32px; height: 32px;
      border-radius: var(--r-sm);
      background: var(--a);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content:''; position:absolute; inset:0;
      background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    }
    .brand-mark i { font-size:13px; color:#fff; position:relative; z-index:1; }
    .brand-name { font-size:15px; font-weight:600; color:var(--t1); letter-spacing:-0.02em; }
    .brand-tag  { font-family:var(--font-mono); font-size:9px; color:var(--t3); letter-spacing:0.05em; margin-top:1px; }

    /* section label */
    .sb-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--t3);
      padding: 16px 18px 8px;
    }

    /* action buttons */
    .sb-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 11px;
      margin: 2px 10px;
      border-radius: var(--r-sm);
      border: 1px solid transparent;
      background: transparent;
      color: var(--t2);
      font-size: 13px;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: all var(--tr);
      text-align: left;
      width: calc(100% - 20px);
    }
    .sb-btn i { width:15px; text-align:center; font-size:11px; flex-shrink:0; }
    .sb-btn:hover { background:var(--s3); color:var(--t1); border-color:var(--b1); }
    .sb-btn.danger:hover { background:rgba(248,113,113,0.09); color:var(--err); border-color:rgba(248,113,113,0.22); }

    .sb-sep { height:1px; background:var(--b1); margin:10px 18px; flex-shrink:0; }

    /* kb section */
    .kb-section { flex:1; min-height:0; display:flex; flex-direction:column; }
    .kb-header {
      display:flex; align-items:center; justify-content:space-between;
      padding: 0 18px 10px;
    }
    .kb-sub { font-size:11px; color:var(--t3); }
    .kb-badge {
      font-family:var(--font-mono); font-size:9px;
      padding:2px 7px; border-radius:4px;
      background:var(--a-dim); color:var(--a); border:1px solid var(--a-bdr);
    }

    .doc-list { flex:1; overflow-y:auto; padding:0 10px 14px; }

    .doc-empty {
      padding:22px 14px; text-align:center;
      color:var(--t3); font-size:12px; line-height:1.75;
    }
    .doc-empty i { display:block; font-size:22px; margin-bottom:10px; color:var(--t3); }

    .doc-item {
      display:flex; align-items:center; gap:10px;
      padding:8px 8px; border-radius:var(--r-sm);
      border:1px solid transparent; cursor:default;
      transition:all var(--tr); margin-bottom:1px;
    }
    .doc-item:hover { background:var(--s3); border-color:var(--b1); }

    .doc-icon {
      width:30px; height:30px; border-radius:5px;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; flex-shrink:0; border:1px solid var(--b1);
    }
    .doc-icon.pdf  { background:rgba(248,113,113,0.10); color:var(--err); }
    .doc-icon.doc  { background:rgba(124,110,249,0.10); color:var(--a);   }
    .doc-icon.txt  { background:rgba(52,211,153,0.10);  color:var(--ok);  }
    .doc-icon.csv  { background:rgba(251,191,36,0.10);  color:var(--warn);}
    .doc-icon.other{ background:var(--s3);              color:var(--t3);  }

    .doc-info { flex:1; min-width:0; }
    .doc-name { font-size:12px; color:var(--t1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .doc-ext  { font-family:var(--font-mono); font-size:9px; color:var(--t3); margin-top:1px; }
    .doc-dot  { width:5px; height:5px; border-radius:50%; background:var(--ok); flex-shrink:0; box-shadow:0 0 5px var(--ok); }

    /* shimmer */
    @keyframes shimmer { from{background-position:200% 0;} to{background-position:-200% 0;} }
    .shimmer {
      height:38px; border-radius:var(--r-sm); margin:2px 8px 4px;
      background:linear-gradient(90deg, var(--s3) 25%, var(--s4) 50%, var(--s3) 75%);
      background-size:200% 100%;
      animation:shimmer 1.5s infinite;
    }

    /* footer */
    .sb-footer { padding:12px 10px; border-top:1px solid var(--b1); flex-shrink:0; }
    .mode-btn {
      display:flex; align-items:center; gap:9px;
      padding:8px 10px; border-radius:var(--r-sm);
      border:1px solid var(--b1); background:transparent;
      color:var(--t2); font-size:12px; font-family:var(--font-sans);
      cursor:pointer; width:100%; transition:all var(--tr);
    }
    .mode-btn i { font-size:11px; }
    .mode-btn:hover { background:var(--s3); color:var(--t1); }
    .pill {
      margin-left:auto; width:32px; height:17px;
      background:var(--s4); border:1px solid var(--b2); border-radius:9px;
      position:relative; transition:background var(--tr);
    }
    .pill::after {
      content:''; position:absolute;
      width:11px; height:11px; border-radius:50%;
      background:var(--t3); top:2px; left:2px;
      transition:all var(--tr);
    }
    body.light .pill { background:var(--a); border-color:var(--a); }
    body.light .pill::after { background:#fff; left:17px; }

    /* ── MAIN ── */
    .main { flex:1; min-width:0; display:flex; flex-direction:column; background:var(--s0); }

    /* topbar */
    .topbar {
      height:54px; display:flex; align-items:center;
      padding:0 20px; gap:12px;
      border-bottom:1px solid var(--b1);
      background:var(--s1); flex-shrink:0;
    }
    .icon-btn {
      width:33px; height:33px; border-radius:var(--r-sm);
      border:1px solid var(--b1); background:transparent;
      color:var(--t2); display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:all var(--tr); font-size:13px; flex-shrink:0;
    }
    .icon-btn:hover { background:var(--s3); color:var(--t1); border-color:var(--b2); }

    .tb-center { flex:1; display:flex; align-items:center; gap:10px; }
    .tb-title  { font-size:14px; font-weight:500; color:var(--t1); letter-spacing:-0.01em; }
    .tb-pill   {
      font-family:var(--font-mono); font-size:9px;
      padding:2px 8px; border-radius:4px;
      background:var(--a-dim); color:var(--a); border:1px solid var(--a-bdr);
    }
    .tb-status { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; color:var(--t3); }
    .status-dot {
      width:6px; height:6px; border-radius:50%;
      background:var(--ok); box-shadow:0 0 5px var(--ok);
      animation:pulse 2.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.45;} }

    /* ── MESSAGES ── */
    .messages { flex:1; overflow-y:auto; padding:28px 0 8px; display:flex; flex-direction:column; }

    @keyframes rise { from{opacity:0;transform:translateY(7px);} to{opacity:1;transform:none;} }

    .msg-row { display:flex; padding:5px 28px; animation:rise 0.2s ease-out both; }
    .msg-row.user { justify-content:flex-end; }
    .msg-row.ai   { justify-content:flex-start; }

    .ai-avatar {
      width:28px; height:28px; border-radius:var(--r-sm);
      background:var(--a); display:flex; align-items:center; justify-content:center;
      font-size:11px; color:#fff; flex-shrink:0;
      margin-right:11px; margin-top:3px;
      position:relative; overflow:hidden;
    }
    .ai-avatar::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(135deg,rgba(255,255,255,0.15) 0%,transparent 55%);
    }
    .ai-avatar i { position:relative; z-index:1; }

    .msg-content { max-width:66%; }
    .msg-sender {
      font-family:var(--font-mono); font-size:9.5px; color:var(--t3);
      margin-bottom:5px; letter-spacing:0.05em;
    }
    .msg-row.user .msg-sender { text-align:right; }

    .bubble {
      padding:12px 16px; border-radius:var(--r-md);
      font-size:14px; line-height:1.68;
      word-break:break-word; white-space:pre-wrap;
    }
    .msg-row.ai .bubble {
      background:var(--s2); border:1px solid var(--b1);
      border-bottom-left-radius:3px; color:var(--t1);
    }
    .msg-row.user .bubble {
      background:var(--u-bg); border:1px solid var(--u-bdr);
      border-bottom-right-radius:3px; color:var(--t1);
    }
    .msg-time { font-family:var(--font-mono); font-size:9px; color:var(--t3); margin-top:5px; }
    .msg-row.user .msg-time { text-align:right; }

    /* typing */
    .typing-row { display:flex; align-items:flex-end; padding:5px 28px; gap:11px; }
    .typing-bub {
      background:var(--s2); border:1px solid var(--b1);
      border-radius:var(--r-md); border-bottom-left-radius:3px;
      padding:13px 15px; display:flex; gap:5px; align-items:center;
    }
    .typing-bub span {
      width:5px; height:5px; border-radius:50%;
      background:var(--t3); animation:blink 1.3s infinite;
    }
    .typing-bub span:nth-child(2){animation-delay:0.22s;}
    .typing-bub span:nth-child(3){animation-delay:0.44s;}
    @keyframes blink{0%,80%,100%{opacity:0.25;transform:scale(0.8);}40%{opacity:1;transform:scale(1);}}

    /* empty */
    .empty {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 24px; text-align:center; gap:14px;
    }
    .empty-glyph {
      width:56px; height:56px; border-radius:var(--r-lg);
      background:var(--s2); border:1px solid var(--b2);
      display:flex; align-items:center; justify-content:center;
      font-size:22px; color:var(--a); margin-bottom:4px;
    }
    .empty-title { font-size:18px; font-weight:600; color:var(--t1); letter-spacing:-0.02em; }
    .empty-sub   { font-size:13px; color:var(--t2); max-width:380px; line-height:1.75; }

    .chips { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:4px; }
    .chip {
      padding:6px 13px; border-radius:var(--r-sm);
      border:1px solid var(--b2); background:var(--s2);
      font-size:11.5px; color:var(--t2); cursor:pointer;
      transition:all var(--tr); font-family:var(--font-mono);
    }
    .chip:hover { border-color:var(--a-bdr); color:var(--a); background:var(--a-dim); }

    /* ── INPUT BAR ── */
    .input-bar {
      padding:14px 22px 20px;
      border-top:1px solid var(--b1);
      background:var(--s1); flex-shrink:0;
    }
    .input-outer { max-width:840px; margin:0 auto; }
    .input-box {
      display:flex; align-items:flex-end; gap:8px;
      padding:10px 13px;
      background:var(--s2); border:1px solid var(--b2);
      border-radius:var(--r-md); transition:border-color var(--tr);
    }
    .input-box:focus-within { border-color:var(--b3); }
    .msg-ta {
      flex:1; background:transparent; border:none; outline:none;
      color:var(--t1); font-size:14px; font-family:var(--font-sans);
      resize:none; line-height:1.58; max-height:140px; overflow-y:auto;
    }
    .msg-ta::placeholder { color:var(--t3); }

    .send-btn {
      width:33px; height:33px; border-radius:var(--r-sm); border:none;
      background:var(--a); color:#fff; font-size:12px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      transition:all var(--tr); flex-shrink:0;
    }
    .send-btn:hover:not(:disabled) { background:var(--a-hover); transform:scale(1.06); }
    .send-btn:disabled { opacity:0.3; cursor:not-allowed; transform:none; }

    .input-meta {
      display:flex; align-items:center; justify-content:space-between;
      margin-top:7px; padding:0 2px;
    }
    .input-hint  { font-family:var(--font-mono); font-size:9px; color:var(--t3); }
    .input-chars { font-family:var(--font-mono); font-size:9px; color:var(--t3); }

    /* ── MODAL ── */
    .backdrop {
      position:fixed; inset:0; background:rgba(0,0,0,0.55);
      display:flex; align-items:center; justify-content:center;
      z-index:200; backdrop-filter:blur(3px); animation:fade .15s;
    }
    @keyframes fade { from{opacity:0;} to{opacity:1;} }
    .modal {
      background:var(--s2); border:1px solid var(--b2);
      border-radius:var(--r-lg); padding:26px 24px 22px; width:340px;
      box-shadow:0 24px 60px rgba(0,0,0,0.5);
      animation:pop .18s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop { from{opacity:0;transform:scale(0.94);} to{opacity:1;transform:none;} }
    .modal-icon {
      width:38px; height:38px; border-radius:var(--r-sm);
      background:rgba(248,113,113,0.10); border:1px solid rgba(248,113,113,0.25);
      display:flex; align-items:center; justify-content:center;
      font-size:14px; color:var(--err); margin-bottom:14px;
    }
    .modal-title { font-size:15px; font-weight:600; color:var(--t1); margin-bottom:7px; letter-spacing:-0.01em; }
    .modal-body  { font-size:13px; color:var(--t2); line-height:1.65; margin-bottom:22px; }
    .modal-row   { display:flex; gap:8px; justify-content:flex-end; }
    .m-btn {
      height:33px; padding:0 15px; border-radius:var(--r-sm);
      font-size:13px; font-family:var(--font-sans);
      cursor:pointer; transition:all var(--tr);
      border:1px solid var(--b2); background:transparent; color:var(--t2);
    }
    .m-btn:hover { background:var(--s4); color:var(--t1); }
    .m-btn.primary { background:var(--err); border-color:var(--err); color:#fff; }
    .m-btn.primary:hover { background:#e86060; }

    /* ── TOAST ── */
    .toast-wrap {
      position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
      z-index:300; pointer-events:none;
    }
    .toast {
      display:flex; align-items:center; gap:9px;
      padding:9px 16px;
      background:var(--s3); border:1px solid var(--b2); border-radius:var(--r-md);
      font-size:13px; color:var(--t1); white-space:nowrap;
      box-shadow:0 8px 32px rgba(0,0,0,0.4);
      animation:toast-in .2s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes toast-in { from{opacity:0;transform:translateY(10px) scale(0.96);} to{opacity:1;transform:none;} }
    .tdot { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
    .tdot.ok  { background:var(--ok);  box-shadow:0 0 6px var(--ok);  }
    .tdot.err { background:var(--err); box-shadow:0 0 6px var(--err); }
  </style>
</head>
<body>
<div id="root"></div>
{% raw %}
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;

  const ts = () => new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

  function extOf(name) {
    const m = name.match(/\.([^.]+)$/);
    return m ? m[1].toLowerCase() : '';
  }

  function iconFor(ext) {
    if (ext === 'pdf')                      return ['fa-file-pdf',   'pdf'];
    if (['doc','docx'].includes(ext))       return ['fa-file-word',  'doc'];
    if (['txt','md'].includes(ext))         return ['fa-file-lines', 'txt'];
    if (['csv','xlsx','xls'].includes(ext)) return ['fa-file-excel', 'csv'];
    return ['fa-file', 'other'];
  }

  function basename(name) {
    const parts = name.split('.');
    if (parts.length > 1) parts.pop();
    return parts.join('.');
  }

  const SUGGESTIONS = [
    'Summarise the key findings',
    'What does the policy say about…',
    'List all action items',
    'Compare the two documents',
  ];

  function App() {
    const [msgs,        setMsgs]        = useState([]);
    const [input,       setInput]       = useState('');
    const [typing,      setTyping]      = useState(false);
    const [sidebar,     setSidebar]     = useState(true);
    const [light,       setLight]       = useState(false);
    const [modal,       setModal]       = useState(false);
    const [toast,       setToast]       = useState(null);
    const [docs,        setDocs]        = useState([]);
    const [docsLoading, setDocsLoading] = useState(true);

    const endRef    = useRef(null);
    const taRef     = useRef(null);
    const toastTmr  = useRef(null);

    useEffect(() => { endRef.current?.scrollIntoView({ behavior:'smooth' }); }, [msgs, typing]);

    /* Fetch actual filenames from /data directory via Flask endpoint */
    const loadDocs = useCallback(async () => {
      setDocsLoading(true);
      try {
        const res = await fetch('/files');
        if (!res.ok) throw new Error('non-ok');
        const data = await res.json();          // Flask returns { files: ["name.pdf", ...] }
        const files = Array.isArray(data.files) ? data.files : [];
        setDocs(files.map((name, i) => ({ id: i, name })));
      } catch (_) {
        setDocs([]);                             // /files endpoint not wired yet — show empty state
      } finally {
        setDocsLoading(false);
      }
    }, []);

    useEffect(() => { loadDocs(); }, [loadDocs]);

    const notify = (text, kind = 'ok') => {
      clearTimeout(toastTmr.current);
      setToast({ text, kind });
      toastTmr.current = setTimeout(() => setToast(null), 2800);
    };

    const toggleMode = () => {
      setLight(p => { document.body.classList.toggle('light', !p); return !p; });
    };

    /* send message — Flask /chat untouched */
    const send = async () => {
      const text = input.trim();
      if (!text || typing) return;
      setInput('');
      if (taRef.current) taRef.current.style.height = 'auto';

      setMsgs(p => [...p, { id: Date.now(), sender:'user', text, time: ts() }]);
      setTyping(true);

      try {
        const res  = await fetch('/chat', {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ message: text }),
        });
        const data = await res.json();
        setMsgs(p => [...p, { id: Date.now()+1, sender:'ai', text: data.response, time: ts() }]);
      } catch (_) {
        setMsgs(p => [...p, {
          id: Date.now()+1, sender:'ai',
          text:'⚠ Something went wrong — please try again.',
          time: ts(),
        }]);
      } finally {
        setTyping(false);
      }
    };

    const onKey   = e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
    const onInput = e => {
      setInput(e.target.value);
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
    };

    /* upload — Flask /upload untouched; then reload /files */
    const upload = async e => {
      const file = e.target.files[0];
      if (!file) return;
      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch('/upload', { method:'POST', body: fd });
        if (!res.ok) throw new Error();
        await loadDocs();
        notify(`"${file.name}" indexed`);
      } catch (_) {
        notify('Upload failed — please retry', 'err');
      }
      e.target.value = '';
    };

    const confirmClear = () => {
      setMsgs([]);
      setModal(false);
      notify('Conversation cleared');
    };

    return (
      <div className="shell">

        {/* ── SIDEBAR ── */}
        <aside className={`sidebar ${sidebar ? '' : 'closed'}`}>
          <div className="sb-inner">

            <div className="sb-brand">
              <div className="brand-mark"><i className="fas fa-circle-nodes"></i></div>
              <div>
                <div className="brand-name">Lexis</div>
                <div className="brand-tag">knowledge assistant · v2</div>
              </div>
            </div>

            <div className="sb-label">Workspace</div>

            {/* upload — sidebar only */}
            <input type="file" id="sb-file" style={{display:'none'}} onChange={upload}
                   accept=".pdf,.doc,.docx,.txt,.md,.csv,.xlsx" />
            <label htmlFor="sb-file" className="sb-btn" style={{cursor:'pointer', display:'flex', marginBottom:2}}>
              <i className="fas fa-arrow-up-from-bracket"></i>
              Upload document
            </label>

            <button className="sb-btn danger" onClick={() => setModal(true)}>
              <i className="fas fa-trash-can"></i>
              Clear conversation
            </button>

            <div className="sb-sep" />

            {/* knowledge base — real files from /data */}
            <div className="kb-section">
              <div className="sb-label" style={{paddingBottom:0}}>Knowledge base</div>
              <div className="kb-header">
                <span className="kb-sub">Indexed files</span>
                <span className="kb-badge">{docs.length}</span>
              </div>
              <div className="doc-list">

                {docsLoading && [0,1,2].map(i =>
                  <div key={i} className="shimmer" />
                )}

                {!docsLoading && docs.length === 0 && (
                  <div className="doc-empty">
                    <i className="fas fa-folder-open" />
                    No documents indexed yet.<br />Upload files to build your knowledge base.
                  </div>
                )}

                {!docsLoading && docs.map(d => {
                  const ext = extOf(d.name);
                  const [ico, cls] = iconFor(ext);
                  return (
                    <div className="doc-item" key={d.id}>
                      <div className={`doc-icon ${cls}`}>
                        <i className={`fas ${ico}`} />
                      </div>
                      <div className="doc-info">
                        <div className="doc-name" title={d.name}>{basename(d.name)}</div>
                        <div className="doc-ext">.{ext || 'file'}</div>
                      </div>
                      <div className="doc-dot" title="Indexed" />
                    </div>
                  );
                })}

              </div>
            </div>

            <div className="sb-footer">
              <button className="mode-btn" onClick={toggleMode}>
                <i className={`fas fa-${light ? 'sun' : 'moon'}`} />
                {light ? 'Light mode' : 'Dark mode'}
                <div className="pill" />
              </button>
            </div>

          </div>
        </aside>

        {/* ── MAIN ── */}
        <main className="main">

          <div className="topbar">
            <button className="icon-btn" onClick={() => setSidebar(p => !p)} title="Toggle sidebar">
              <i className="fas fa-sidebar" />
            </button>
            <div className="tb-center">
              <span className="tb-title">Conversation</span>
              <span className="tb-pill">RAG · {docs.length} docs</span>
            </div>
            <div className="tb-status">
              <div className="status-dot" />
              ready
            </div>
          </div>

          <div className="messages">
            {msgs.length === 0 && !typing && (
              <div className="empty">
                <div className="empty-glyph"><i className="fas fa-sparkles" /></div>
                <div className="empty-title">Ask your knowledge base</div>
                <div className="empty-sub">
                  Upload documents via the sidebar, then ask questions. Lexis retrieves
                  and synthesises relevant information from your indexed files.
                </div>
                <div className="chips">
                  {SUGGESTIONS.map(s => (
                    <div className="chip" key={s}
                         onClick={() => { setInput(s); taRef.current?.focus(); }}>
                      {s}
                    </div>
                  ))}
                </div>
              </div>
            )}

            {msgs.map(m => (
              <div key={m.id} className={`msg-row ${m.sender}`}>
                {m.sender === 'ai' && (
                  <div className="ai-avatar"><i className="fas fa-circle-nodes" /></div>
                )}
                <div className="msg-content">
                  <div className="msg-sender">{m.sender === 'ai' ? 'lexis' : 'you'}</div>
                  <div className="bubble">{m.text}</div>
                  <div className="msg-time">{m.time}</div>
                </div>
              </div>
            ))}

            {typing && (
              <div className="typing-row">
                <div className="ai-avatar"><i className="fas fa-circle-nodes" /></div>
                <div className="typing-bub"><span/><span/><span/></div>
              </div>
            )}
            <div ref={endRef} />
          </div>

          <div className="input-bar">
            <div className="input-outer">
              <div className="input-box">
                <textarea
                  ref={taRef}
                  className="msg-ta"
                  value={input}
                  onChange={onInput}
                  onKeyDown={onKey}
                  placeholder="Ask anything about your documents…"
                  rows={1}
                />
                <button className="send-btn" onClick={send}
                        disabled={!input.trim() || typing} title="Send (Enter)">
                  <i className="fas fa-arrow-up" />
                </button>
              </div>
              <div className="input-meta">
                <span className="input-hint">↵ send &nbsp;·&nbsp; shift+↵ new line</span>
                <span className="input-chars">{input.length > 0 ? `${input.length}` : ''}</span>
              </div>
            </div>
          </div>

        </main>

        {/* ── CLEAR MODAL ── */}
        {modal && (
          <div className="backdrop" onClick={() => setModal(false)}>
            <div className="modal" onClick={e => e.stopPropagation()}>
              <div className="modal-icon"><i className="fas fa-trash-can" /></div>
              <div className="modal-title">Clear this conversation?</div>
              <div className="modal-body">
                All messages in the current session will be permanently removed.
                Your knowledge base documents will remain indexed and searchable.
              </div>
              <div className="modal-row">
                <button className="m-btn" onClick={() => setModal(false)}>Cancel</button>
                <button className="m-btn primary" onClick={confirmClear}>Clear chat</button>
              </div>
            </div>
          </div>
        )}

        {/* ── TOAST ── */}
        {toast && (
          <div className="toast-wrap">
            <div className="toast">
              <div className={`tdot ${toast.kind}`} />
              {toast.text}
            </div>
          </div>
        )}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>
