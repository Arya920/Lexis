<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lexis — RAG Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    button { font-family: inherit; cursor: pointer; }

    :root {
      --bg-base:  #050607;
      --bg-1:     #090b0d;
      --bg-2:     #0d1014;
      --bg-3:     #131820;
      --bg-4:     #1a2030;
      --border-1: rgba(0,255,100,0.06);
      --border-2: rgba(0,255,100,0.12);
      --border-3: rgba(0,255,100,0.22);
      --t1: #e8f5ec;
      --t2: #7a9e85;
      --t3: #3a5244;
      --g:       #00e664;
      --g-dim:   rgba(0,230,100,0.08);
      --g-glow:  rgba(0,230,100,0.20);
      --g-hover: #00cc55;
      --user-bg:  #0d1f14;
      --user-bdr: rgba(0,230,100,0.25);
      --a-color:  #a78bfa;
      --a-dim:    rgba(167,139,250,0.10);
      --a-bdr:    rgba(167,139,250,0.28);
      --err:  #ff5555;
      --warn: #ffaa44;
      --ok:   #00e664;
      --sb-w: 280px;
      --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
      --tr: 0.15s cubic-bezier(0.4,0,0.2,1);
    }
    body.light {
      --bg-base:  #f5f7f5; --bg-1: #ffffff; --bg-2: #f0f4f0;
      --bg-3: #e8ede8; --bg-4: #dde6dd;
      --border-1: rgba(0,150,60,0.08); --border-2: rgba(0,150,60,0.15); --border-3: rgba(0,150,60,0.28);
      --t1: #0e1a12; --t2: #3a6645; --t3: #7aaa88;
      --g: #00aa44; --g-dim: rgba(0,170,68,0.08); --g-glow: rgba(0,170,68,0.18); --g-hover: #008833;
      --user-bg: #e8f5ec; --user-bdr: rgba(0,150,60,0.25);
      --a-color: #7c3aed; --a-dim: rgba(124,58,237,0.08); --a-bdr: rgba(124,58,237,0.22);
    }

    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-base); color: var(--t1);
      height: 100vh; overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* FIX 1: scanlines use pointer-events:none so they never dim/block clicks */
    body:not(.light)::before {
      content: ''; position: fixed; inset: 0;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
      pointer-events: none; z-index: 9999; opacity: 0.3;
    }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    .shell { display: flex; height: 100vh; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sb-w); min-width: var(--sb-w);
      background: var(--bg-1); border-right: 1px solid var(--border-1);
      display: flex; flex-direction: column; flex-shrink: 0;
      overflow: hidden; transition: min-width var(--tr), width var(--tr); position: relative;
    }
    .sidebar::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--g), transparent); opacity: 0.5;
    }
    .sidebar.closed { width: 0; min-width: 0; }
    .sb-inner { width: var(--sb-w); min-width: var(--sb-w); height: 100%; display: flex; flex-direction: column; }

    .sb-brand {
      padding: 20px 18px 16px; border-bottom: 1px solid var(--border-1);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .brand-mark {
      width: 34px; height: 34px; border-radius: var(--r-sm); background: var(--g);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 0 20px var(--g-glow);
    }
    .brand-mark i { font-size: 13px; color: #000; }
    .brand-name { font-size: 16px; font-weight: 700; color: var(--t1); letter-spacing: -0.03em; }
    .brand-version { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--g); margin-top: 2px; letter-spacing: 0.1em; opacity: 0.7; }

    .sb-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--t3); padding: 14px 18px 7px; }

    .new-chat-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 10px 10px 4px; padding: 8px 10px; border-radius: var(--r-sm);
      border: 1px solid var(--border-2); background: var(--g-dim); color: var(--g);
      font-family: 'Space Grotesk', sans-serif; font-size: 12.5px; font-weight: 500;
      cursor: pointer; transition: all var(--tr); width: calc(100% - 20px);
    }
    .new-chat-btn:hover { background: var(--g); color: #000; box-shadow: 0 0 16px var(--g-glow); border-color: var(--g); }
    .new-chat-btn i { font-size: 11px; }

    .sb-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; margin: 2px 10px; border-radius: var(--r-sm);
      border: 1px solid transparent; background: transparent;
      color: var(--t2); font-size: 12.5px; font-family: 'Space Grotesk', sans-serif;
      cursor: pointer; transition: all var(--tr); text-align: left; width: calc(100% - 20px);
    }
    .sb-btn i { width: 14px; text-align: center; font-size: 11px; flex-shrink: 0; color: var(--t3); }
    .sb-btn:hover { background: var(--bg-3); color: var(--t1); border-color: var(--border-1); }
    .sb-btn:hover i { color: var(--g); }
    .sb-btn.danger:hover { background: rgba(255,85,85,0.08); color: var(--err); border-color: rgba(255,85,85,0.2); }
    .sb-btn.danger:hover i { color: var(--err); }

    .sb-sep { height: 1px; background: var(--border-1); margin: 8px 18px; flex-shrink: 0; }

    /* history */
    .history-list { overflow-y: auto; max-height: 148px; padding: 2px 10px 6px; }
    .hist-item {
      display: flex; align-items: center; gap: 8px; padding: 6px 8px;
      border-radius: var(--r-sm); cursor: pointer; transition: all var(--tr);
      border: 1px solid transparent; margin-bottom: 1px;
    }
    .hist-item:hover { background: var(--bg-3); border-color: var(--border-1); }
    .hist-item.active { background: var(--g-dim); border-color: var(--border-2); }
    .hist-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--t3); flex-shrink: 0; }
    .hist-item.active .hist-dot { background: var(--g); box-shadow: 0 0 5px var(--g); }
    .hist-label { flex: 1; min-width: 0; font-size: 11.5px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hist-item.active .hist-label { color: var(--g); }
    .hist-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); flex-shrink: 0; }
    .hist-del {
      width: 18px; height: 18px; border-radius: 3px; display: none; align-items: center;
      justify-content: center; background: transparent; border: none; color: var(--t3);
      font-size: 9px; transition: all var(--tr); flex-shrink: 0; cursor: pointer;
    }
    .hist-item:hover .hist-del { display: flex; }
    .hist-del:hover { background: rgba(255,85,85,0.12); color: var(--err); }

    /* toggle */
    .toggle {
      width: 36px; height: 20px; background: var(--bg-4); border: 1px solid var(--border-2);
      border-radius: 10px; position: relative; cursor: pointer; transition: all var(--tr); flex-shrink: 0;
    }
    .toggle::after {
      content: ''; position: absolute; width: 13px; height: 13px; border-radius: 50%;
      background: var(--t3); top: 2px; left: 2px; transition: all var(--tr);
    }
    .toggle.on { background: var(--g-dim); border-color: var(--g); }
    .toggle.on::after { background: var(--g); left: 18px; box-shadow: 0 0 8px var(--g-glow); }

    /* knowledge base */
    .kb-section { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .kb-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 8px; }
    .kb-sub { font-size: 11px; color: var(--t3); font-family: 'JetBrains Mono', monospace; }
    .kb-count { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 3px; background: var(--g-dim); color: var(--g); border: 1px solid var(--border-2); }
    .doc-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
    .doc-empty { padding: 24px 14px; text-align: center; color: var(--t3); font-size: 11px; line-height: 1.85; font-family: 'JetBrains Mono', monospace; }
    .doc-empty i { display: block; font-size: 18px; margin-bottom: 10px; opacity: 0.4; }

    .doc-item {
      display: flex; align-items: center; gap: 10px; padding: 7px 8px;
      border-radius: var(--r-sm); border: 1px solid transparent;
      transition: all var(--tr); margin-bottom: 1px;
    }
    .doc-item:hover { background: var(--bg-3); border-color: var(--border-1); }
    .doc-icon { width: 28px; height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; border: 1px solid var(--border-1); }
    .doc-icon.pdf   { background: rgba(255,85,85,0.08); color: var(--err); }
    .doc-icon.doc   { background: var(--g-dim); color: var(--g); }
    .doc-icon.txt   { background: rgba(0,230,100,0.06); color: var(--ok); }
    .doc-icon.csv   { background: rgba(255,170,68,0.08); color: var(--warn); }
    .doc-icon.other { background: var(--bg-3); color: var(--t3); }
    .doc-info { flex: 1; min-width: 0; }
    .doc-name { font-size: 11.5px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-meta { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); margin-top: 1px; }
    .doc-pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--g); box-shadow: 0 0 6px var(--g); animation: pulse 2.5s infinite; flex-shrink: 0; }
    /* FIX 4: remove button visible on doc hover, pulse hidden */
    .doc-remove {
      width: 22px; height: 22px; border-radius: 3px; display: none;
      align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--t3);
      font-size: 10px; transition: all var(--tr); flex-shrink: 0; cursor: pointer;
    }
    .doc-item:hover .doc-remove { display: flex; }
    .doc-item:hover .doc-pulse  { display: none; }
    .doc-remove:hover { background: rgba(255,85,85,0.14); color: var(--err); }

    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    .shimmer { height: 36px; border-radius: var(--r-sm); margin: 2px 8px 4px; background: linear-gradient(90deg, var(--bg-3) 25%, var(--bg-4) 50%, var(--bg-3) 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite; }

    .sb-footer { padding: 10px 10px 14px; flex-shrink: 0; }
    .light-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--border-1);
      background: transparent; cursor: pointer; transition: all var(--tr); width: 100%;
    }
    .light-toggle:hover { background: var(--bg-3); }
    .light-toggle-left { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--t2); }
    .light-toggle-left i { font-size: 11px; color: var(--t3); }

    /* ── MAIN ── */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg-base); }

    .topbar {
      height: 54px; display: flex; align-items: center; padding: 0 18px; gap: 10px;
      border-bottom: 1px solid var(--border-1); background: var(--bg-1); flex-shrink: 0; position: relative;
    }
    .topbar::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, var(--g), transparent); opacity: 0.2;
    }
    .icon-btn {
      width: 32px; height: 32px; border-radius: var(--r-sm); border: 1px solid var(--border-1);
      background: transparent; color: var(--t2); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--tr); font-size: 12px; flex-shrink: 0;
    }
    .icon-btn:hover { background: var(--bg-3); color: var(--t1); border-color: var(--border-2); }
    .tb-center { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
    .tb-title { font-size: 14px; font-weight: 600; color: var(--t1); letter-spacing: -0.02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tb-badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .tb-badge { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 7px; border-radius: 3px; border: 1px solid; white-space: nowrap; }
    .tb-badge.green  { background: var(--g-dim); color: var(--g); border-color: var(--border-2); }
    .tb-badge.dim    { background: var(--bg-3); color: var(--t3); border-color: var(--border-1); }
    .tb-badge.warn   { background: rgba(255,170,68,0.08); color: var(--warn); border-color: rgba(255,170,68,0.2); }
    .tb-badge.purple { background: var(--a-dim); color: var(--a-color); border-color: var(--a-bdr); }
    .tb-status { display: flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--t3); flex-shrink: 0; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--g); box-shadow: 0 0 6px var(--g); animation: pulse 2.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── MESSAGES ── */
    .messages { flex: 1; overflow-y: auto; padding: 28px 0 10px; display: flex; flex-direction: column; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .msg-row { display: flex; padding: 5px 24px; animation: rise 0.2s ease-out both; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai   { justify-content: flex-start; }
    .ai-avatar {
      width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--g);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #000; flex-shrink: 0; margin-right: 10px; margin-top: 2px;
      box-shadow: 0 0 14px var(--g-glow);
    }
    .ai-avatar.agent { background: var(--a-color); box-shadow: 0 0 14px var(--a-dim); }
    .ai-avatar.agent i { color: #fff; }
    .msg-content { max-width: 68%; }
    .msg-sender { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); margin-bottom: 5px; letter-spacing: 0.08em; }
    .msg-row.user .msg-sender { text-align: right; }
    .bubble { padding: 12px 16px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.72; word-break: break-word; }
    .msg-row.ai .bubble   { background: var(--bg-2); border: 1px solid var(--border-1); border-bottom-left-radius: 2px; color: var(--t1); }
    .msg-row.user .bubble { background: var(--user-bg); border: 1px solid var(--user-bdr); border-bottom-right-radius: 2px; color: var(--t1); }

    /* FIX 3: agent token highlight */
    .agent-token {
      display: inline-block; font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 600; color: var(--a-color);
      background: var(--a-dim); border: 1px solid var(--a-bdr);
      border-radius: 3px; padding: 1px 6px; margin-right: 3px;
    }

    .sources { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
    .source-chip { font-family: 'JetBrains Mono', monospace; font-size: 9px; padding: 2px 8px; border-radius: 3px; background: var(--g-dim); color: var(--g); border: 1px solid var(--border-2); }
    .msg-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); margin-top: 5px; }
    .msg-row.user .msg-time { text-align: right; }

    .typing-row { display: flex; align-items: flex-end; padding: 5px 24px; gap: 10px; }
    .typing-bub { background: var(--bg-2); border: 1px solid var(--border-1); border-radius: var(--r-md); border-bottom-left-radius: 2px; padding: 12px 14px; display: flex; gap: 5px; align-items: center; }
    .typing-bub span { width: 5px; height: 5px; border-radius: 50%; background: var(--g); animation: blink 1.3s infinite; box-shadow: 0 0 5px var(--g-glow); }
    .typing-bub span:nth-child(2) { animation-delay: 0.22s; }
    .typing-bub span:nth-child(3) { animation-delay: 0.44s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.2; transform: scale(0.7); } 40% { opacity: 1; transform: scale(1); } }

    .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 28px; text-align: center; gap: 14px; }
    .empty-glyph { width: 58px; height: 58px; border-radius: var(--r-lg); background: var(--bg-2); border: 1px solid var(--border-2); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--g); box-shadow: 0 0 30px var(--g-glow); margin-bottom: 4px; }
    .empty-title { font-size: 22px; font-weight: 700; color: var(--t1); letter-spacing: -0.03em; }
    .empty-sub { font-size: 13px; color: var(--t2); max-width: 400px; line-height: 1.8; }
    .mode-indicator { display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 5px 12px; border-radius: 3px; background: var(--g-dim); color: var(--g); border: 1px solid var(--border-2); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
    .chip { padding: 6px 14px; border-radius: var(--r-sm); border: 1px solid var(--border-2); background: var(--bg-2); font-size: 11.5px; color: var(--t2); cursor: pointer; transition: all var(--tr); font-family: 'JetBrains Mono', monospace; }
    .chip:hover { border-color: var(--border-3); color: var(--g); background: var(--g-dim); }

    /* ── INPUT BAR ── */
    .input-bar { padding: 10px 20px 18px; border-top: 1px solid var(--border-1); background: var(--bg-1); flex-shrink: 0; }
    .input-outer { max-width: 860px; margin: 0 auto; }

    /* FIX 2: mode strip — only RAG, Web, Agentic */
    .mode-strip { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; }
    .mode-chip {
      display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 3px;
      border: 1px solid var(--border-1); background: transparent;
      font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: var(--t3);
      cursor: pointer; transition: all var(--tr);
    }
    .mode-chip i { font-size: 9px; }
    .mode-chip:hover { border-color: var(--border-2); color: var(--t2); background: var(--bg-3); }
    .mode-chip.on-green  { background: var(--g-dim); color: var(--g); border-color: var(--border-2); }
    .mode-chip.on-warn   { background: rgba(255,170,68,0.08); color: var(--warn); border-color: rgba(255,170,68,0.2); }
    .mode-chip.on-purple { background: var(--a-dim); color: var(--a-color); border-color: var(--a-bdr); }
    .strip-info { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); }

    /* FIX 3: agent autocomplete dropdown */
    .input-wrap { position: relative; }
    .agent-dropdown {
      position: absolute; bottom: calc(100% + 6px); left: 0; right: 0;
      background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md);
      overflow: hidden; box-shadow: 0 -12px 32px rgba(0,0,0,0.45); z-index: 50;
    }
    .agent-dropdown-hdr { padding: 7px 12px 5px; font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 1px solid var(--border-1); }
    .agent-opt { display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; transition: background var(--tr); border-bottom: 1px solid var(--border-1); }
    .agent-opt:last-child { border-bottom: none; }
    .agent-opt:hover, .agent-opt.focused { background: var(--bg-3); }
    .agent-opt-icon { width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; flex-shrink: 0; background: var(--a-dim); color: var(--a-color); border: 1px solid var(--a-bdr); }
    .agent-opt-name { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--a-color); }
    .agent-opt-desc { font-size: 11px; color: var(--t3); margin-top: 1px; }

    .input-box {
      display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px;
      background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-md);
      transition: border-color var(--tr), box-shadow var(--tr);
    }
    .input-box:focus-within { border-color: var(--border-3); box-shadow: 0 0 0 2px var(--g-dim); }
    .input-box.agentic:focus-within { border-color: var(--a-bdr); box-shadow: 0 0 0 2px var(--a-dim); }
    .msg-ta { flex: 1; background: transparent; border: none; outline: none; color: var(--t1); font-size: 13.5px; font-family: 'Space Grotesk', sans-serif; resize: none; line-height: 1.6; max-height: 140px; overflow-y: auto; }
    .msg-ta::placeholder { color: var(--t3); }

    .send-btn {
      width: 32px; height: 32px; border-radius: var(--r-sm); border: none;
      background: var(--g); color: #000; font-size: 11px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all var(--tr); flex-shrink: 0; box-shadow: 0 0 12px var(--g-glow);
    }
    .send-btn:hover:not(:disabled) { background: var(--g-hover); transform: scale(1.05); box-shadow: 0 0 18px var(--g-glow); }
    .send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; box-shadow: none; }
    .send-btn.agentic { background: var(--a-color); box-shadow: 0 0 12px var(--a-dim); color: #fff; }
    .send-btn.agentic:hover:not(:disabled) { background: #8b5cf6; box-shadow: 0 0 18px var(--a-dim); }

    .input-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding: 0 2px; }
    .input-hint  { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); }
    .input-chars { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--t3); }

    /* ── MODALS ── */
    .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(4px); animation: fade .14s; }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    .modal { background: var(--bg-2); border: 1px solid var(--border-2); border-radius: var(--r-lg); padding: 26px 24px 22px; width: 340px; box-shadow: 0 24px 60px rgba(0,0,0,0.6); animation: pop .18s cubic-bezier(0.34,1.56,0.64,1); }
    @keyframes pop { from { opacity: 0; transform: scale(0.93); } to { opacity: 1; transform: none; } }
    .modal-icon { width: 36px; height: 36px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 13px; margin-bottom: 14px; }
    .modal-icon.err  { background: rgba(255,85,85,0.08); border: 1px solid rgba(255,85,85,0.22); color: var(--err); }
    .modal-icon.warn { background: rgba(255,170,68,0.08); border: 1px solid rgba(255,170,68,0.22); color: var(--warn); }
    .modal-title { font-size: 15px; font-weight: 600; color: var(--t1); margin-bottom: 7px; letter-spacing: -0.02em; }
    .modal-body  { font-size: 12.5px; color: var(--t2); line-height: 1.7; margin-bottom: 16px; }
    .modal-fname { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--t1); background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 4px; padding: 4px 10px; display: inline-block; margin-bottom: 16px; }
    .modal-row { display: flex; gap: 8px; justify-content: flex-end; }
    .m-btn { height: 32px; padding: 0 14px; border-radius: var(--r-sm); font-size: 12.5px; font-family: 'Space Grotesk', sans-serif; cursor: pointer; transition: all var(--tr); border: 1px solid var(--border-2); background: transparent; color: var(--t2); }
    .m-btn:hover { background: var(--bg-4); color: var(--t1); }
    .m-btn.danger { border-color: rgba(255,85,85,0.35); color: var(--err); }
    .m-btn.danger:hover { background: rgba(255,85,85,0.1); }

    /* ── TOAST ── */
    .toast-wrap { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 300; pointer-events: none; }
    .toast { display: flex; align-items: center; gap: 9px; padding: 9px 16px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: var(--r-md); font-size: 12px; color: var(--t1); white-space: nowrap; box-shadow: 0 8px 32px rgba(0,0,0,0.5); animation: toast-in .2s cubic-bezier(0.34,1.56,0.64,1); font-family: 'JetBrains Mono', monospace; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(0.95); } to { opacity: 1; transform: none; } }
    .tdot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .tdot.ok   { background: var(--ok);   box-shadow: 0 0 6px var(--ok);   }
    .tdot.err  { background: var(--err);  box-shadow: 0 0 6px var(--err);  }
    .tdot.warn { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  </style>
</head>
<body>
<div id="root"></div>
{% raw %}
<script type="text/babel">
  const { useState, useEffect, useRef, useCallback } = React;
  const ts  = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const uid = () => (Date.now() + Math.random()).toString(36);

  function extOf(n) { const m = n.match(/\.([^.]+)$/); return m ? m[1].toLowerCase() : ''; }
  function iconFor(e) {
    if (e === 'pdf') return ['fa-file-pdf','pdf'];
    if (['doc','docx'].includes(e)) return ['fa-file-word','doc'];
    if (['txt','md'].includes(e))   return ['fa-file-lines','txt'];
    if (['csv','xlsx','xls'].includes(e)) return ['fa-file-excel','csv'];
    return ['fa-file','other'];
  }
  function basename(n) { const p = n.split('.'); if (p.length > 1) p.pop(); return p.join('.'); }
  function shortPreview(msgs) {
    const f = msgs.find(m => m.sender === 'user');
    if (!f) return 'New conversation';
    const clean = f.text.replace(/\/[\w-]+/g,'').trim();
    return (clean || f.text).slice(0,38) + ((clean||f.text).length > 38 ? '…' : '');
  }

  const AGENTS = [
    { name: 'web-search-agent',          icon: 'fa-globe',        desc: 'Search & retrieve live web results'  },
    { name: 'data-analysis-agent',       icon: 'fa-chart-bar',    desc: 'Analyse datasets, tables & numbers'  },
    { name: 'create-visualization-agent',icon: 'fa-chart-pie',    desc: 'Generate charts and visual reports'  },
    { name: 'summarization-agent',       icon: 'fa-compress-alt', desc: 'Summarise long documents quickly'    },
    { name: 'code-agent',                icon: 'fa-code',         desc: 'Write, debug and explain code'       },
  ];

  const SUGGESTIONS = ['Summarise key findings','What does the policy say about…','List all action items','Compare the two documents'];

  const LS = {
    get: (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } },
    set: (k, v)  => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  /* Render message text with highlighted /agent-name tokens */
  function BubbleContent({ text }) {
    const parts = [];
    const re = /(\/[\w-]+)/g;
    let last = 0, m;
    while ((m = re.exec(text)) !== null) {
      const isAgent = AGENTS.some(a => '/'+a.name === m[0]);
      if (!isAgent) continue;
      if (m.index > last) parts.push({ type:'text', val: text.slice(last, m.index) });
      parts.push({ type:'agent', val: m[0] });
      last = m.index + m[0].length;
    }
    if (last < text.length) parts.push({ type:'text', val: text.slice(last) });
    if (!parts.length) parts.push({ type:'text', val: text });
    return (
      <span>
        {parts.map((t, i) =>
          t.type === 'agent'
            ? <span key={i} className="agent-token">{t.val}</span>
            : <span key={i} style={{whiteSpace:'pre-wrap'}}>{t.val}</span>
        )}
      </span>
    );
  }

  /* Agent autocomplete dropdown */
  function AgentDropdown({ filter, onSelect, focusIdx }) {
    const q = filter.replace('/','').toLowerCase();
    const list = AGENTS.filter(a => a.name.includes(q));
    if (!list.length) return null;
    return (
      <div className="agent-dropdown">
        <div className="agent-dropdown-hdr">Agents — ↑↓ navigate · ↵ or Tab select</div>
        {list.map((a, i) => (
          <div key={a.name} className={`agent-opt ${i===focusIdx?'focused':''}`}
               onMouseDown={e => { e.preventDefault(); onSelect(a); }}>
            <div className="agent-opt-icon"><i className={`fas ${a.icon}`}/></div>
            <div>
              <div className="agent-opt-name">/{a.name}</div>
              <div className="agent-opt-desc">{a.desc}</div>
            </div>
          </div>
        ))}
      </div>
    );
  }

  /* ── App ── */
  function App() {
    const [sessions,    setSessions]    = useState(() => LS.get('lexis_sessions', []));
    const [activeId,    setActiveId]    = useState(() => LS.get('lexis_active', null));
    const [input,       setInput]       = useState('');
    const [typing,      setTyping]      = useState(false);
    const [sidebar,     setSidebar]     = useState(true);
    const [light,       setLight]       = useState(() => LS.get('lexis_light', false));
    const [modal,       setModal]       = useState(null);
    const [toast,       setToast]       = useState(null);
    const [docs,        setDocs]        = useState([]);
    const [docsLoading, setDocsLoading] = useState(true);

    // Modes (FIX 2: sidebar has no mode toggles; only input strip)
    const [ragMode,    setRagMode]    = useState(false);
    const [webSearch,  setWebSearch]  = useState(false);
    const [agentMode,  setAgentMode]  = useState(false);

    // Agent autocomplete state
    const [showDrop,    setShowDrop]    = useState(false);
    const [agentFilter, setAgentFilter] = useState('');
    const [dropFocus,   setDropFocus]   = useState(0);
    const [activeAgent, setActiveAgent] = useState(null);

    const endRef   = useRef(null);
    const taRef    = useRef(null);
    const toastTmr = useRef(null);

    const currentSession = sessions.find(s => s.id === activeId) || null;
    const msgs = currentSession ? currentSession.msgs : [];

    const setMsgs = fn => setSessions(prev =>
      prev.map(s => s.id === activeId
        ? { ...s, msgs: typeof fn === 'function' ? fn(s.msgs) : fn }
        : s)
    );

    useEffect(() => { LS.set('lexis_sessions', sessions); }, [sessions]);
    useEffect(() => { LS.set('lexis_active',   activeId); }, [activeId]);
    useEffect(() => { LS.set('lexis_light',     light);   }, [light]);
    useEffect(() => { document.body.classList.toggle('light', light); }, [light]);
    useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [msgs, typing]);

    // Ensure a session always exists
    useEffect(() => {
      if (!activeId || !sessions.find(s => s.id === activeId)) {
        if (sessions.length > 0) { setActiveId(sessions[0].id); }
        else {
          const id = uid();
          setSessions([{ id, createdAt: ts(), msgs: [] }]);
          setActiveId(id);
        }
      }
    }, []);

    // Load docs from backend
    const loadDocs = useCallback(async () => {
      setDocsLoading(true);
      try {
        const res  = await fetch('/files');
        if (!res.ok) throw new Error();
        const data = await res.json();
        setDocs((data.files || []).map((name, i) => ({ id: i, name })));
      } catch { setDocs([]); }
      finally { setDocsLoading(false); }
    }, []);
    useEffect(() => { loadDocs(); }, [loadDocs]);

    const notify = (text, kind = 'ok') => {
      clearTimeout(toastTmr.current);
      setToast({ text, kind });
      toastTmr.current = setTimeout(() => setToast(null), 2800);
    };

    const newChat = () => {
      const id = uid();
      setSessions(prev => [{ id, createdAt: ts(), msgs: [] }, ...prev]);
      setActiveId(id); setInput('');
    };
    const switchSession = id => { setActiveId(id); setInput(''); };
    const deleteSession = id => {
      setSessions(prev => prev.filter(s => s.id !== id));
      if (activeId === id) {
        const rem = sessions.filter(s => s.id !== id);
        if (rem.length) setActiveId(rem[0].id);
        else { const nid = uid(); setSessions([{ id: nid, createdAt: ts(), msgs: [] }]); setActiveId(nid); }
      }
    };

    /* ── input + agent detection ── */
    const handleInputChange = e => {
      const val = e.target.value;
      setInput(val);
      e.target.style.height = 'auto';
      e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';

      const cur = e.target.selectionStart;
      const before = val.slice(0, cur);
      const slash  = before.match(/(\/[\w-]*)$/);
      if (slash) {
        setAgentFilter(slash[1]); setShowDrop(true); setDropFocus(0);
      } else {
        setShowDrop(false); setAgentFilter('');
      }
      const found = AGENTS.find(a => val.includes('/'+a.name));
      setActiveAgent(found || null);
    };

    const selectAgent = agent => {
      const cur = taRef.current?.selectionStart ?? input.length;
      const before = input.slice(0, cur);
      const after  = input.slice(cur);
      const si = before.lastIndexOf('/');
      const newVal = before.slice(0, si) + '/'+agent.name+' ' + after;
      setInput(newVal);
      setShowDrop(false); setAgentFilter(''); setActiveAgent(agent);
      setTimeout(() => {
        const pos = before.slice(0, si).length + agent.name.length + 2;
        taRef.current?.setSelectionRange(pos, pos);
        taRef.current?.focus();
      }, 0);
    };

    const onKey = e => {
      if (showDrop) {
        const list = AGENTS.filter(a => a.name.includes(agentFilter.replace('/','').toLowerCase()));
        if (e.key === 'ArrowDown')  { e.preventDefault(); setDropFocus(f => Math.min(f+1, list.length-1)); return; }
        if (e.key === 'ArrowUp')    { e.preventDefault(); setDropFocus(f => Math.max(f-1, 0)); return; }
        if (e.key === 'Tab' || (e.key === 'Enter' && list[dropFocus])) {
          e.preventDefault(); selectAgent(list[dropFocus]); return;
        }
        if (e.key === 'Escape') { setShowDrop(false); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    };

    /* ── send ── */
    const send = async () => {
      const text = input.trim();
      if (!text || typing) return;
      setInput(''); setShowDrop(false);
      if (taRef.current) taRef.current.style.height = 'auto';

      const usedAgent = activeAgent;
      setActiveAgent(null);

      setMsgs(p => [...p, { id: uid(), sender:'user', text, time: ts() }]);
      setTyping(true);

      try {
        const res  = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, rag: ragMode, web_search: webSearch, agent_mode: agentMode, agent: usedAgent?.name || null }),
        });
        const data = await res.json();
        setMsgs(p => [...p, { id: uid(), sender:'ai', text: data.response, sources: data.sources||[], agent: usedAgent?.name||null, time: ts() }]);
      } catch {
        setMsgs(p => [...p, { id: uid(), sender:'ai', text:'⚠ Something went wrong — please try again.', time: ts() }]);
      } finally {
        setTyping(false);
      }
    };

    /* ── upload ── */
    const upload = async e => {
      const file = e.target.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      try {
        const res = await fetch('/upload', { method:'POST', body: fd });
        if (!res.ok) throw new Error();
        await loadDocs(); notify(`"${file.name}" indexed`);
      } catch { notify('Upload failed — please retry','err'); }
      e.target.value = '';
    };

    /* ── remove doc ── */
    const confirmRemoveDoc = async () => {
      const doc = modal?.doc; if (!doc) return;
      setModal(null);
      try {
        await fetch('/remove-file', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ filename: doc.name }) });
        await loadDocs();
        notify(`"${doc.name}" removed from RAG`);
      } catch {
        // optimistic remove
        setDocs(prev => prev.filter(d => d.id !== doc.id));
        notify(`"${doc.name}" removed (placeholder)`, 'warn');
      }
    };

    const isAgentic  = agentMode || !!activeAgent;
    const modeLabel  = agentMode ? (activeAgent ? activeAgent.name : 'agentic') : (ragMode ? (webSearch ? 'RAG+Web' : 'RAG') : (webSearch ? 'web' : 'direct'));

    return (
      <div className="shell">

        {/* ── SIDEBAR ── */}
        <aside className={`sidebar ${sidebar ? '' : 'closed'}`}>
          <div className="sb-inner">

            <div className="sb-brand">
              <div className="brand-mark"><i className="fas fa-terminal"/></div>
              <div>
                <div className="brand-name">Lexis</div>
                <div className="brand-version">RAG ASSISTANT · v2</div>
              </div>
            </div>

            <button className="new-chat-btn" onClick={newChat}><i className="fas fa-plus"/> New conversation</button>

            {/* History */}
            {sessions.length > 0 && <>
              <div className="sb-label">History</div>
              <div className="history-list">
                {sessions.map(s => (
                  <div key={s.id} className={`hist-item ${s.id===activeId?'active':''}`} onClick={() => switchSession(s.id)}>
                    <div className="hist-dot"/>
                    <div className="hist-label">{shortPreview(s.msgs)}</div>
                    <div className="hist-time">{s.createdAt}</div>
                    <button className="hist-del" onClick={ev=>{ev.stopPropagation();deleteSession(s.id);}} title="Delete"><i className="fas fa-xmark"/></button>
                  </div>
                ))}
              </div>
            </>}

            <div className="sb-sep"/>

            {/* Workspace — FIX 2: no mode toggles here */}
            <div className="sb-label">Workspace</div>
            <input type="file" id="sb-file" style={{display:'none'}} onChange={upload} accept=".pdf,.doc,.docx,.txt,.md,.csv,.xlsx"/>
            <label htmlFor="sb-file" className="sb-btn" style={{cursor:'pointer',display:'flex'}}>
              <i className="fas fa-arrow-up-from-bracket"/> Upload document
            </label>
            <button className="sb-btn danger" onClick={() => setModal({type:'clear'})}>
              <i className="fas fa-trash-can"/> Clear conversation
            </button>

            <div className="sb-sep"/>

            {/* Knowledge base — FIX 4: remove button per doc */}
            <div className="kb-section">
              <div className="sb-label" style={{paddingBottom:0}}>Knowledge base</div>
              <div className="kb-header">
                <span className="kb-sub">indexed docs</span>
                <span className="kb-count">{docs.length}</span>
              </div>
              <div className="doc-list">
                {docsLoading && [0,1,2].map(i=><div key={i} className="shimmer"/>)}
                {!docsLoading && docs.length === 0 && (
                  <div className="doc-empty"><i className="fas fa-folder-open"/>no docs indexed yet.<br/>upload files to populate<br/>your knowledge base.</div>
                )}
                {!docsLoading && docs.map(d => {
                  const ext = extOf(d.name); const [ico,cls] = iconFor(ext);
                  return (
                    <div className="doc-item" key={d.id}>
                      <div className={`doc-icon ${cls}`}><i className={`fas ${ico}`}/></div>
                      <div className="doc-info">
                        <div className="doc-name" title={d.name}>{basename(d.name)}</div>
                        <div className="doc-meta">.{ext||'file'}</div>
                      </div>
                      <div className="doc-pulse" title="Indexed"/>
                      <button className="doc-remove" title="Remove from RAG" onClick={() => setModal({type:'remove-doc', doc:d})}>
                        <i className="fas fa-trash-can"/>
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="sb-footer">
              <button className="light-toggle" onClick={() => setLight(p=>!p)}>
                <div className="light-toggle-left"><i className={`fas fa-${light?'sun':'moon'}`}/>{light?'Light mode':'Dark mode'}</div>
                <div className={`toggle ${light?'on':''}`}/>
              </button>
            </div>
          </div>
        </aside>

        {/* ── MAIN ── */}
        <main className="main">

          <div className="topbar">
            <button className="icon-btn" onClick={() => setSidebar(p=>!p)} title="Toggle sidebar"><i className="fas fa-sidebar"/></button>
            <div className="tb-center">
              <span className="tb-title">{currentSession && msgs.length > 0 ? shortPreview(msgs) : 'Conversation'}</span>
              <div className="tb-badges">
                <span className={`tb-badge ${ragMode?'green':'dim'}`}>{ragMode?'RAG':'direct'}</span>
                {webSearch && <span className="tb-badge warn">web</span>}
                {isAgentic  && <span className="tb-badge purple">agentic</span>}
                <span className="tb-badge dim">{docs.length} docs</span>
              </div>
            </div>
            <div className="tb-status"><div className="status-dot"/>{typing?'thinking':'ready'}</div>
          </div>

          <div className="messages">
            {msgs.length === 0 && !typing && (
              <div className="empty">
                <div className="empty-glyph"><i className="fas fa-terminal"/></div>
                <div className="empty-title">Lexis</div>
                <div className="empty-sub">
                  {agentMode
                    ? 'Agentic mode active — type / to invoke an agent, or describe what you need.'
                    : ragMode
                      ? 'Upload documents in the sidebar, then query your indexed knowledge base.'
                      : 'RAG mode off — chatting directly with the language model.'}
                </div>
                <div className="mode-indicator">
                  <i className={`fas fa-${agentMode?'robot':ragMode?'database':'comment'}`}/> {modeLabel} mode
                </div>
                <div className="chips">
                  {SUGGESTIONS.map(s=>(
                    <div className="chip" key={s} onClick={()=>{setInput(s);taRef.current?.focus();}}>{s}</div>
                  ))}
                </div>
              </div>
            )}

            {msgs.map(m => {
              const isAgentMsg = m.sender === 'ai' && m.agent;
              const agentDef   = AGENTS.find(a => a.name === m.agent);
              return (
                <div key={m.id} className={`msg-row ${m.sender}`}>
                  {m.sender === 'ai' && (
                    <div className={`ai-avatar ${isAgentMsg?'agent':''}`}>
                      <i className={`fas ${isAgentMsg?(agentDef?.icon||'fa-robot'):'fa-terminal'}`}/>
                    </div>
                  )}
                  <div className="msg-content">
                    <div className="msg-sender">{m.sender==='ai' ? (m.agent||'lexis') : 'you'}</div>
                    <div className="bubble"><BubbleContent text={m.text}/></div>
                    {m.sender==='ai' && m.sources?.length > 0 && (
                      <div className="sources">
                        {m.sources.map((src,i)=><span key={i} className="source-chip"><i className="fas fa-file" style={{marginRight:4}}/>{src.label}</span>)}
                      </div>
                    )}
                    <div className="msg-time">{m.time}</div>
                  </div>
                </div>
              );
            })}

            {typing && (
              <div className="typing-row">
                <div className={`ai-avatar ${activeAgent?'agent':''}`}><i className="fas fa-terminal"/></div>
                <div className="typing-bub"><span/><span/><span/></div>
              </div>
            )}
            <div ref={endRef}/>
          </div>

          {/* ── INPUT BAR ── */}
          <div className="input-bar">
            <div className="input-outer">

              {/* FIX 2: mode strip — only here, not sidebar */}
              <div className="mode-strip">
                <button className={`mode-chip ${ragMode?'on-green':''}`} onClick={()=>setRagMode(p=>!p)} title="Toggle RAG">
                  <i className="fas fa-database"/> RAG
                </button>
                <button className={`mode-chip ${webSearch?'on-warn':''}`} onClick={()=>setWebSearch(p=>!p)} title="Toggle web search">
                  <i className="fas fa-globe"/> Web
                </button>
                {/* FIX 3: Agentic mode chip — toggles mode and seeds / in input */}
                <button
                  className={`mode-chip ${agentMode?'on-purple':''}`}
                  onClick={() => {
                    const next = !agentMode;
                    setAgentMode(next);
                    if (next && !input.startsWith('/')) {
                      setInput(prev => (prev ? prev : '/'));
                      setTimeout(() => { taRef.current?.focus(); taRef.current?.setSelectionRange(1,1); }, 30);
                    }
                  }}
                  title="Toggle agentic mode"
                >
                  <i className="fas fa-robot"/> Agentic
                </button>
                <div className="strip-info">{modeLabel} · {docs.length} indexed</div>
              </div>

              {/* Input box with autocomplete */}
              <div className="input-wrap">
                {showDrop && (
                  <AgentDropdown filter={agentFilter} onSelect={selectAgent} focusIdx={dropFocus}/>
                )}
                <div className={`input-box ${isAgentic?'agentic':''}`}>
                  <textarea
                    ref={taRef}
                    className="msg-ta"
                    value={input}
                    onChange={handleInputChange}
                    onKeyDown={onKey}
                    onBlur={() => setTimeout(()=>setShowDrop(false), 160)}
                    placeholder={agentMode ? 'Type / to invoke an agent, or just ask…' : ragMode ? 'Ask anything about your documents…' : 'Chat directly with the AI…'}
                    rows={1}
                  />
                  <button className={`send-btn ${isAgentic?'agentic':''}`} onClick={send} disabled={!input.trim()||typing} title="Send (Enter)">
                    <i className="fas fa-arrow-up"/>
                  </button>
                </div>
              </div>

              <div className="input-meta">
                <span className="input-hint">↵ send · shift+↵ newline{agentMode ? ' · / invoke agent' : ''}</span>
                <span className="input-chars">{input.length > 0 ? `${input.length} chars` : ''}</span>
              </div>
            </div>
          </div>

        </main>

        {/* ── CLEAR MODAL ── */}
        {modal?.type === 'clear' && (
          <div className="backdrop" onClick={()=>setModal(null)}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
              <div className="modal-icon err"><i className="fas fa-trash-can"/></div>
              <div className="modal-title">Clear this conversation?</div>
              <div className="modal-body">All messages in the current session will be permanently removed. Your indexed knowledge base documents remain unaffected.</div>
              <div className="modal-row">
                <button className="m-btn" onClick={()=>setModal(null)}>Cancel</button>
                <button className="m-btn danger" onClick={()=>{setMsgs([]);setModal(null);notify('Conversation cleared');}}>Clear chat</button>
              </div>
            </div>
          </div>
        )}

        {/* FIX 4: Remove doc modal */}
        {modal?.type === 'remove-doc' && (
          <div className="backdrop" onClick={()=>setModal(null)}>
            <div className="modal" onClick={e=>e.stopPropagation()}>
              <div className="modal-icon warn"><i className="fas fa-file-xmark"/></div>
              <div className="modal-title">Remove from RAG memory?</div>
              <div className="modal-body">This will unindex the file. The model will no longer retrieve information from it during queries.</div>
              <div className="modal-fname">{modal.doc?.name}</div>
              <div className="modal-row">
                <button className="m-btn" onClick={()=>setModal(null)}>Cancel</button>
                <button className="m-btn danger" onClick={confirmRemoveDoc}>Remove file</button>
              </div>
            </div>
          </div>
        )}

        {/* ── TOAST ── */}
        {toast && (
          <div className="toast-wrap">
            <div className="toast"><div className={`tdot ${toast.kind}`}/>{toast.text}</div>
          </div>
        )}

      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
{% endraw %}
</body>
</html>
